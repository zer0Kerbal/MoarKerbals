// Add recruitment alongside MKS experience training; preserve the existing MKS modules.
@PART[Tundra_Akademy]:HAS[!MODULE[KerbalRecruitment]]:NEEDS[MoarKerbals,KolonyTools]:FOR[MoarKerbals]
{
    MODULE
    {
        name = KerbalRecruitment
        recruitmentTraits = Pilot,Engineer,Scientist
        recipeIngredients = ElectricCharge,LiquidFuel,Ore
        recipeAmounts = 5000,50,50
        costFunds = 5000
        costScience = 1
        costReputation = 2
    }
}

// This also extends the stock Academy parts. Trait names are validated at runtime.
@PART[*]:HAS[@MODULE[KerbalRecruitment]]:NEEDS[MoarKerbals,KolonyTools]:AFTER[MoarKerbals]
{
    @MODULE[KerbalRecruitment],*
    {
        %recruitmentTraits = Pilot,Engineer,Scientist,Kolonist,Miner,Technician,Mechanic,Biologist,Geologist,Farmer,Medic,Quartermaster,Scout
    }
}
