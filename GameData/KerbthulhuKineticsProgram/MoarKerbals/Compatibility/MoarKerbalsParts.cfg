// Allocate all six KIS pod inventories before KIS initialises the prefab.
// Instances retain two seats at 2.5 m and gain six at 3.75 m by volume.
@PART[moar-klonebay-ground]:HAS[@MODULE[TweakScale],!MODULE[ModuleMoarScaledCrew]]:NEEDS[MoarKerbals,MoarKerbalsParts,TweakScale]:AFTER[MoarKerbalsParts]
{
    @CrewCapacity = 6
    @INTERNAL
    {
        @name = MoarExpanded-moar-klonebay-ground
    }
    @MODULE[TweakScale]
    {
        %TWEAKSCALEEXPONENTS[Part]
        {
            %name = Part
            %CrewCapacity = 0
        }
    }
    MODULE
    {
        name = ModuleMoarScaledCrew
        nominalSeats = 2
        nominalScale = 2.5
        maximumSeats = 6
        lastKnownScale = 2.5
    }
}

