// Repair the existing parts-pack scaling module without adding another module or changing its size choices.
@PART[moar-klonebay-*,moar-kloneschool*,moar-kuddleshack]:NEEDS[MoarKerbalsParts,TweakScale]:AFTER[MoarKerbalsParts]
{
    @MODULE[TweakScale]:HAS[#type[KW250]]
    {
        @type = stack
    }
}

// The reproduction cabin is usable both on the surface and in orbit.
// Current KuddleShack has no situation gate; keep its part declarations consistent as well.
@PART[moar-kuddleshack]:NEEDS[MoarKerbalsParts]:AFTER[MoarKerbalsParts]
{
    @MODULE[KuddleShack]
    {
        %allowOrbital = true
        %allowSplashedOrLanded = true
    }
}

// Restore the per-attempt recipe documented in newer upstream schools.
// Do not replace a recipe already supplied by a life-support compatibility patch.
@PART[moar-kloneschool,moar-kloneschool-orbital]:NEEDS[MoarKerbalsParts]:AFTER[MoarKerbalsParts]
{
    @MODULE[KerbalRecruitment]:HAS[~recipeIngredients[*],~recipeAmounts[*]]
    {
        recipeIngredients = ElectricCharge,LiquidFuel,Ore
        recipeAmounts = 5000,50,50
    }
    @MODULE[KerbalRecruitment]
    {
        %costFunds = 5000
        %costScience = 1
        %costReputation = 2
    }
}

// Reserve the maximum supported seats at prefab-load time so KIS and stock loading initialise all ten.
// The instance controller sets the actual capacity to floor(3 * (diameter / 2.5)^3): 3 or 10.
@PART[moar-kuddleshack]:HAS[@MODULE[TweakScale],!MODULE[ModuleMoarScaledCrew]]:NEEDS[MoarKerbals,MoarKerbalsParts,TweakScale]:AFTER[MoarKerbalsParts]
{
    @CrewCapacity = 10
    @INTERNAL
    {
        @name = MoarKuddleShackExpandedInternal
    }
    @MODULE[TweakScale]
    {
        // Disable the native quadratic/clamped calculation; ModuleMoarScaledCrew owns capacity.
        %TWEAKSCALEEXPONENTS[Part]
        {
            %name = Part
            %CrewCapacity = 0
        }
    }
    MODULE
    {
        name = ModuleMoarScaledCrew
        nominalSeats = 3
        nominalScale = 2.5
        maximumSeats = 10
        lastKnownScale = 2.5
    }
}

